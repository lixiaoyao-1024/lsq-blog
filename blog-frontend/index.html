<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ZMR Blog — 记录代码、项目和日常片段。">
    <title>LSQ-Blog</title>
    <!-- 全局音乐播放器：APlayer + MetingJS（第三方 CDN，音频不落本地） -->
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/aplayer/1.10.1/APlayer.min.css" />
    <script src="https://cdn.bootcdn.net/ajax/libs/aplayer/1.10.1/APlayer.min.js" defer></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/meting/2.0.1/Meting.min.js" defer></script>
    <script>
      // 首帧前应用主题：默认深色梦幻，避免闪烁
      ;(function () {
        var t = localStorage.getItem('personal-blog-theme')
        document.documentElement.classList.toggle('dark', t !== 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
