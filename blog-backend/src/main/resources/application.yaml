server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/personal_blog?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Docker 启动竞态兜底：连接池初始化失败不阻断应用启动，
      # 改为按 connection-timeout（30s）惰性重试，配合 DatabaseBootstrapper 等待 MySQL 就绪
      initialization-fail-timeout: -1
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  # 文件上传限制（Spring Boot 4 使用 spring.http.multipart）
  http:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  upload-dir: ./uploads
  auth:
    # 令牌签名密钥（HMAC-SHA256）。生产环境务必替换为足够长的随机字符串。
    token-secret: personal-blog-change-me-8f3a2c9d41e7b6f0-please-replace-in-prod
    # 登录令牌有效期（小时），默认 7 天
    token-ttl-hours: 168

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
